name: SonarCloud

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: project_tracker_test
          POSTGRES_PASSWORD: project_tracker_test
          POSTGRES_DB: project_tracker_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U project_tracker_test -d project_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      pull-requests: read

    env:
      DATABASE_URL: postgresql://project_tracker_test:project_tracker_test@127.0.0.1:55432/project_tracker_test
      TEST_DATABASE_URL: postgresql://project_tracker_test:project_tracker_test@127.0.0.1:55432/project_tracker_test
      TEST_DATABASE_ADMIN_URL: postgresql://project_tracker_test:project_tracker_test@127.0.0.1:55432/postgres
      SECRET_KEY: ci-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Java (required by Sonar Scanner)
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install uv
      - name: Install uv
        run: pip install uv

      # Install backend dependencies
      - name: Install Backend Dependencies
        working-directory: backend
        run: uv sync --frozen

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Install frontend dependencies
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      # Run Backend Tests
      - name: Run Backend Tests
        working-directory: backend
        run: uv run pytest tests/ --cov=app --cov-report=xml:coverage.xml

      # Run Frontend Tests
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test -- --run --coverage

      # SonarCloud Scan
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
